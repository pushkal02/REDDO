apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker
  namespace: reddo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broker
  template:
    metadata:
      labels:
        app: broker
    spec:
      containers:
        - name: broker
          image: localhost/broker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres.reddo.svc.cluster.local:5432/reddo"
            - name: SPRING_RABBITMQ_HOST
              value: "rabbitmq.reddo.svc.cluster.local"
            - name: SPRING_DATA_REDIS_HOST
              value: "redis.reddo.svc.cluster.local"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            tcpSocket:
              port: 8081
            failureThreshold: 30
            periodSeconds: 5
