apiVersion: v1
kind: ServiceAccount
metadata:
  name: probe-sa
  namespace: reddo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: probe-metrics-reader
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: probe-metrics-reader-binding
subjects:
- kind: ServiceAccount
  name: probe-sa
  namespace: reddo
roleRef:
  kind: ClusterRole
  name: probe-metrics-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: reddo
  labels:
    app: probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      serviceAccountName: probe-sa
      containers:
      - name: probe
        image: localhost/probe:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8082
        env:
        - name: RABBITMQ_URL
          value: "http://guest:guest@rabbitmq:15672"
        - name: PORT
          value: "8082"
        resources:
          limits:
            cpu: "200m"
            memory: "128Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: reddo
  labels:
    app: probe
spec:
  ports:
  - port: 8082
    targetPort: 8082
    protocol: TCP
  selector:
    app: probe
