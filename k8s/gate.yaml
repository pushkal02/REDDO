apiVersion: v1
kind: Service
metadata:
  name: gate
  namespace: reddo
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: gate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gate
  namespace: reddo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gate
  template:
    metadata:
      labels:
        app: gate
    spec:
      containers:
        - name: gate
          image: localhost/gate:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              value: "postgres://postgres:postgres@postgres.reddo.svc.cluster.local:5432/reddo?sslmode=disable"
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq.reddo.svc.cluster.local:5672/"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
