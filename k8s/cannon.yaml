apiVersion: apps/v1
kind: Deployment
metadata:
  name: cannon
  namespace: reddo
  labels:
    app: cannon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cannon
  template:
    metadata:
      labels:
        app: cannon
    spec:
      containers:
      - name: cannon
        image: localhost/cannon:v2
        imagePullPolicy: Never
        ports:
        - containerPort: 8083
        env:
        - name: GATEWAY_URL
          value: "http://gate:8080"
        - name: PORT
          value: "8083"
        resources:
          limits:
            cpu: "200m"
            memory: "128Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: cannon
  namespace: reddo
  labels:
    app: cannon
spec:
  ports:
  - port: 8083
    targetPort: 8083
    protocol: TCP
  selector:
    app: cannon
